services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-delivery-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://webhook:webhook@postgres:5432/webhook_delivery"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"

  postgres:
    image: postgres:18
    container_name: webhook-delivery-postgres
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook_delivery"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: webhook-delivery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-delivery-worker
    command: uv run celery -A webhook_delivery_service.infrastructure.celery:celery_app worker --loglevel=info
    environment:
      DATABASE_URL: "postgresql+psycopg://webhook:webhook@postgres:5432/webhook_delivery"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
